padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}.topbar .admin-badge{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:.82rem}.topbar .admin-badge span{color:var(--muted)}.topbar .admin-name{color:var(--accent2);font-weight:600;cursor:pointer;padding:4px 10px;border:1px solid var(--border);border-radius:var(--radius)}.content{flex:1;overflow-y:auto;padding:24px}/* ΓöÇΓöÇ Search Bar ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.search-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}.search-input{flex:1;min-width:280px;padding:10px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.9rem;outline:none;transition:.2s}.search-input:focus{border-color:var(--accent)}.search-input::placeholder{color:var(--muted)}.search-filter{padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.82rem;cursor:pointer}.search-filter:hover,.search-filter.active{border-color:var(--accent);color:var(--accent2)}/* ΓöÇΓöÇ Cards & Panels ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:24px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}.stat-card .val{font-size:1.8rem;font-weight:700;color:var(--accent2)}.stat-card .lbl{font-size:.72rem;color:var(--muted);margin-top:2px}.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden}.panel-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border);cursor:pointer}.panel-header h3{font-size:.92rem;font-weight:600}.panel-body{padding:16px 18px}/* ΓöÇΓöÇ Family Cards ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.family-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}.family-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.2s}.family-card:hover{border-color:var(--accent);box-shadow:var(--shadow)}.family-card-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:rgba(99,102,241,.08);border-bottom:1px solid var(--border)}.family-card-header h4{font-size:.9rem;font-weight:600}.family-type-badge{font-size:.68rem;padding:2px 8px;border-radius:10px;font-weight:600}.family-type-badge.couple{background:rgba(236,72,153,.15);color:#ec4899}.family-type-badge.family{background:rgba(34,197,94,.15);color:#22c55e}.family-type-badge.individual{background:rgba(59,130,246,.15);color:#3b82f6}.family-card-body{padding:12px 16px}.family-member{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)}.family-member:last-child{border-bottom:none}.member-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem;flex-shrink:0}.member-avatar.male{background:rgba(59,130,246,.2);color:#60a5fa}.member-avatar.female{background:rgba(236,72,153,.2);color:#f472b6}.member-avatar.unknown{background:rgba(139,143,163,.2);color:#8b8fa3}.member-info{flex:1;min-width:0}.member-name{font-size:.85rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-name .nickname{color:var(--warn);font-weight:400;font-style:italic;margin-left:6px}.member-email{font-size:.72rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.member-phone{font-size:.72rem;color:var(--info)}.family-card-actions{display:flex;gap:6px;padding:8px 16px;border-top:1px solid var(--border);justify-content:flex-end}/* ΓöÇΓöÇ Buttons ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.btn{padding:6px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:5px;font-family:var(--font)}.btn:hover{border-color:var(--accent);color:var(--accent2)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.primary:hover{background:var(--accent2)}.btn.danger{border-color:var(--danger);color:var(--danger)}.btn.danger:hover{background:var(--danger);color:#fff}.btn.success{border-color:var(--success);color:var(--success)}.btn.success:hover{background:var(--success);color:#fff}.btn.sm{padding:4px 10px;font-size:.72rem}.btn.icon-btn{padding:4px 8px}/* ΓöÇΓöÇ Modal ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.2s}.modal-overlay.open{opacity:1;pointer-events:auto}.modal{background:var(--surface);border:1px solid var(--border);border-radius:12px;width:560px;max-width:95vw;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow)}.modal-header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}.modal-header h3{font-size:1rem;font-weight:600}.modal-close{background:none;border:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px}.modal-close:hover{color:var(--text)}.modal-body{padding:20px;overflow-y:auto;flex:1}.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--border)}/* ΓöÇΓöÇ Form ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.form-group{margin-bottom:14px}.form-group label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;font-weight:500}.form-group input,.form-group select,.form-group textarea{width:100%;padding:8px 12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:.85rem;outline:none;font-family:var(--font)}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--accent)}.form-row{display:flex;gap:12px}.form-row .form-group{flex:1}.form-group textarea{resize:vertical;min-height:60px}/* ΓöÇΓöÇ Table ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:.82rem}th{text-align:left;padding:10px 12px;background:var(--surface);border-bottom:2px solid var(--border);font-weight:600;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;position:sticky;top:0;z-index:1}td{padding:10px 12px;border-bottom:1px solid var(--border)}tr:hover td{background:rgba(99,102,241,.04)}tr.selected td{background:rgba(99,102,241,.1)}/* ΓöÇΓöÇ Audit log ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.audit-entry{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);font-size:.82rem}.audit-entry:last-child{border-bottom:none}.audit-time{flex-shrink:0;width:140px;color:var(--muted);font-size:.72rem}.audit-admin{flex-shrink:0;width:120px;color:var(--accent2);font-weight:600;font-size:.78rem}.audit-action{flex:1}.audit-action .badge{display:inline-block;padding:1px 7px;border-radius:8px;font-size:.68rem;font-weight:600;marg ilies;  document.getElementById('nav-mem-count').textContent = STATE.stats.totalMembers;}function findMember(email) {  return STATE.members.find(m => m.email === (email||'').toLowerCase());}function findFamily(id) {  return STATE.families.find(f => f.id === id);}// ΓöÇΓöÇ Audit Logging ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇfunction audit(action, category, details, target, targetId) {  STATE.auditLog.push({    id: genId(),    timestamp: new Date().toISOString(),    admin: STATE.adminName,    action,    category,  // add|edit|delete|move|create    details,    target,    // member|family|relationship|system    targetId: targetId || ''  });  saveState();}// ΓöÇΓöÇ Toast ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇfunction toast(msg, type='success') {  const c = document.getElementById('toasts');  const t = document.createElement('div');  t.className = 'toast ' + type;  t.textContent = msg;  c.appendChild(t);  setTimeout(() => t.remove(), 4000);}// ΓöÇΓöÇ Modal ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇfunction openModal(title, bodyHtml, footerHtml) {  document.getElementById('modalTitle').textContent = title;  document.getElementById('modalBody').innerHTML = bodyHtml;  document.getElementById('modalFooter').innerHTML = footerHtml || '';  document.getElementById('modalOverlay').classList.add('open');}function closeModal() { document.getElementById('modalOverlay').classList.remove('open'); }document.getElementById('modalClose').onclick = closeModal;document.getElementById('modalOverlay').onclick = e => { if(e.target===e.currentTarget) closeModal(); };// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓ ="val">${s.singles}</div><div class="lbl">Individuals</div></div>      <div class="stat-card"><div class="val">${s.withPhone}</div><div class="lbl">With Phone</div></div>      <div class="stat-card"><div class="val">${s.withAddress}</div><div class="lbl">With Address</div></div>      <div class="stat-card"><div class="val">${s.ecMembers}</div><div class="lbl">EC Members</div></div>      <div class="stat-card"><div class="val">${s.totalAuditEntries || STATE.auditLog.length}</div><div class="lbl">Audit Entries</div></div>    </div>    <div class="panel">      <div class="panel-header"><h3>≡ƒòÉ Recent Audit Activity</h3></div>      <div class="panel-body">        ${STATE.auditLog.slice(-8).reverse().map(a => `          <div class="audit-entry">            <div class="audit-time">${fmtDate(a.timestamp)}</div>            <div class="audit-admin">${esc(a.admin)}</div>            <div class="audit-action"><span class="badge ${a.category}">${a.category}</span>${esc(a.details)}</div>          </div>        `).join('') || '<div class="empty-state">No activity yet</div>'}      </div>    </div>    <div style="display:flex;gap:12px;margin-top:12px">      <button class="btn primary" onclick="render('families')">≡ƒæ¿ΓÇì≡ƒæ⌐ΓÇì≡ƒæº Manage Families</button>      <button class="btn primary" onclick="render('members')">≡ƒæñ Manage Members</button>      <button class="btn" onclick="render('search')">≡ƒöì Search</button>    </div>  `;}// ΓöÇΓöÇ Families View ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇfunction renderFamilies(filter) {  let fams = [...STATE.families].sort((a,b) => a.displayName.localeCompare(b.displayName));  if (filter) {    const q = filter.toLowerCase();    fams = fams.filter(f => {      if (f.displayName.toLowerCase().includes(q)) return true;      return f.memberEmails.some(e => {        const m = findMember(e);        return m && (m.displayName.toLowerCase().includes(q) || m.firstName.toLowerCase().includes(q) ||          m.lastName.toLowerCase().includes(q) || (m.nickname||'').toLowerCase().includes(q) ||          (m.phone||'').includes(q) || (m.address||'').toLowerCase().includes(q) ||          (m.city||'').toLowerCase().includes(q));      });    });  }  return `    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">      <h2>≡ƒæ¿ΓÇì≡ƒæ⌐ΓÇì≡ƒæº Families (${fams.length})</h2>      <div style="display:flex;gap:8px">        <input class="search-input" id="familyFilter" placeholder="Filter families..." value="${esc(filter||'')}" style="max-width:260px">        <button class="btn primary" id="addFamilyBtn">∩╝ï New Family</button>      </div>    </div>    <div class="family-grid" id="familyGrid">      ${fams.map(f => renderFamilyCard(f)).join('')}      ${fams.length===0 ? '<div class="empty-state"><div class="icon">≡ƒÅá</div><p>No families match your filter</p></div>' : ''}    </div>  `;}function renderFamilyCard(f) {  const members = f.memberEmails.map(e => findMember(e)).filter(Boolean);  return `    <div class="family-card" data-fid="${f.id}">      <div class="family-card-header">        <h4>${esc(f.displayName || 'Unnamed Family')}</h4>        <span class="family-type-badge ${f.type}">${f.type} (${members.length})</span>      </div>      <div class="family-card-body">        ${members.map(m => `          <div class="family-member">            <div class="member-avatar ${(m.gender||'').toLowerCase()==='male'?'male':(m.gender||'').toLowerCase()==='female'?'female':'unknown'}">${(m.firstName||'?')[0]}${(m.lastName||'')[0]||''}</div>            <div class="member-info">              <div class="member-name">${esc(m.displayName||m.firstName)}${m.nickname ? '<span class="nickname">"${esc(m.nickname)}"</span>' : ''}</div>              <div class="member-email">${esc(m.email)}</div>              ${m.phone ? '<div class="member-phone">≡ƒô₧ '+esc(m.phone)+'</div>' : ''}            </div>            <button class="btn sm icon-btn edit-member-btn" data-email="${m.email}" title="Edit member">Γ£Å∩╕Å</button>            <button class="btn sm icon-btn danger remove-from-family-btn" data-email="${m.email}" data-fid="${f.id}" title="Remove from family">Γ£ò</button>          </div>        `).join('')}        ${f.relationships.length ? '<div style="margin-top:8px;font-size:.72rem;color:var(--muted)">Relationships: '+f.relationships.map(r => {          const fm = findMember(r.from); const tm = findMember(r.to);          return '<span class="rel-badge '+r.type+'">'+(fm?fm.firstName:r.from)+' Γåö '+(tm?tm.firstName:r.to)+' ('+r.type+')</span>';        }).join(' ')+'</div>' : ''}      </div>      <div class="family-card-actions">        <button class="btn sm" onclick="addMemberToFamily('${f.id}')">∩╝ï Add Member</button>        <button class="btn sm" onclick="addRelationship('${f.id}')">≡ƒöù Relationship</button>        <button class="btn sm" onclick="editFamily('${f.id}')">Γ£Å∩╕Å Edit</button>        <button class="btn sm danger" onclick="deleteFamily('${f.id}')">≡ƒùæ∩╕Å</button>      </div>    </div>  `;}function bindFamilyEvents() {  document.getElementById('familyFilter')?.addEventListener('input', e => {    document.getElementById('content').innerHTML = renderFamilies(e.target.value);    bindFamilyEvents();    document.getElementById('familyFilter')?.focus();  });  document.getElementById('addFamilyBtn')?.addEventListener('click', () => createFamily());  document.querySelectorAll('.edit-member-btn').forEach(b => b.addEventListener('click', e => {    e.stopPropagation();    editMember(b.dataset.email);  }));  document.querySelectorAll('.remove-from-family-btn').forEach(b => b.addEventListener('click', e => {    e.stopPropagation();    removeMemberFromFamily(b.dataset.email, b.dataset.fid);  }));}// ΓöÇΓöÇ Family CRUD ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓ eState(); toast('Member deleted'); render(STATE.currentView);}// ΓöÇΓöÇ Search View ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇfunction renderSearch() {  return `    <h2 style="margin-bottom:16px">≡ƒöì Universal Search</h2>    <div class="search-bar">      <input class="search-input" id="uniSearch" placeholder="Search by name, nickname, phone number, email, address, city, zip..." autofocus>    </div>    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">      <button class="search-filter active" data-sf="all">All Fields</button>      <button class="search-filter" data-sf="name">Name / Nickname</button>      <button class="search-filter" data-sf="phone">Phone</button>      <button class="search-filter" data-sf="email">Email</button>      <button class="search-filter" data-sf="address">Address / City</button>      <button class="search-filter" data-sf="family">Family Name</button>    </div>    <div id="searchResults"></div>  `;}function bindSearchEvents() {  let currentFilter = 'all';  const input = document.getElementById('uniSearch');  const resDiv = document.getElementById('searchResults');  document.querySelectorAll('.search-filter').forEach(btn => btn.addEventListener('click', () => {    document.querySelectorAll('.search-filter').forEach(b => b.classList.remove('active'));    btn.classList.add('active');    currentFilter = btn.dataset.sf;    doSearch();  }));  function doSearch() {    const q = (input.value||'').trim().toLowerCase();    if (!q || q.length < 2) { resDiv.innerHTML = '<div class="empty-state"><div class="icon">≡ƒöì</div><p>Type at least 2 characters to search</p></div>'; return; }    // Search members    const memResults = STATE.members.filter(m => {      if (currentFilter === 'name' || currentFilter === 'all') {        if (m.displayName.toLowerCase().includes(q) || m.firstName.toLowerCase().includes(q) || re ${cls}">${score}</div>`;}function fuCategoryBadge(cat) {  return `<span class="fu-category ${cat}">${cat}</span>`;}function fuFormatDate(d) {  if (!d) return 'ΓÇö';  try { return new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' }); }  catch { return d; }}function fuAdminName(email) {  const a = FU_EC_ADMINS.find(x => x.email === email);  return a ? `${a.name} (${a.role})` : email || 'ΓÇö';}function renderFollowUp() {  loadFollowUpData();  const q = FOLLOWUP_DATA.queue || [];  const a = FOLLOWUP_DATA.approved || [];  const s = FOLLOWUP_DATA.sent || [];  const st = FOLLOWUP_DATA.stopped || [];  const stats = FOLLOWUP_DATA.stats || {};  return `    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px">      <div>        <h2>≡ƒôº Email Follow-Up Agent</h2>        <p style="font-size:.78rem;color:var(--muted);margin-top:4px">Automatically detects critical unanswered emails and queues them for EC admin approval before follow-up.</p>      </div>      <div style="display:flex;gap:8px">        <button class="btn primary" id="fuScanBtn" title="Scan Gmail for unanswered critical emails">≡ƒöì Scan Emails</button>        <button class="btn success" id="fuExecBtn" title="Send follow-ups for all approved items">≡ƒôñ Execute Follow-Ups</button>        <button class="btn" id="fuImportBtn" title="Load follow-up data from JSON file">≡ƒôÑ Import</button>      </div>    </div>    <div class="stats-grid" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:16px">      <div class="stat-card"><div class="val" style="color:var(--warn)">${q.length}</div><div class="lbl">Pending Review</div></div>      <div class="stat-card"><div class="val" style="color:var(--accent2)">${a.length}</div><div class="lbl">Approved</div></div>      <div class="stat-card"><div class="val" style="color:var(--success)">${s.length}</div><div class="lbl">Sent</div></div>      <div class="stat-card"><div class="val" style="color:var(--danger)">${st.length}</div><div class="lbl">Stopped</div></div>      <div class="stat-card"><div class="val">${stats.totalScanned||0}</div><div class="lbl">Total Scanned</div></div>    </div>    <div class="fu-tab-bar">      <div class="fu-tab active" data-fu-tab="pending">≡ƒö╢ Pending Review <span class="fu-tab-badge" style="background:var(--warn);color:#1e293b">${q.length}</span></div>      <div class="fu-tab" data-fu-tab="approved">Γ£à Approved <span class="fu-tab-badge">${a.length}</span></div>      <div class="fu-tab" data-fu-tab="sent">≡ƒô¼ Sent <span class="fu-tab-badge" style="background:var(--success)">${s.length}</span></div>      <div class="fu-tab" data-fu-tab="stopped">≡ƒ¢æ Stopped <span class="fu-tab-badge" style="background:var(--danger)">${st.length}</span></div>    </div>    <!-- Pending Review -->    <div class="fu-section active" id="fuSecPending">      ${q.length === 0 ? `        <div class="fu-empty"><div class="fu-empty-icon">Γ£à</div><p>No emails pending review. Run a <strong>Scan</strong> to detect critical unanswered emails.</p></div>      ` : q.sort((a,b) => b.classification.score - a.classification.score).map(item => `        <div class="fu-card" data-fu-id="${item.id}">          <div class="fu-card-header">            ${fuScoreBadge(item.classification.score)}            <div style="flex:1;min-width:0">              <div style="font-weight:600;font-size:.88rem" class="truncate">${esc(item.subject)}</div>              <div class="fu-meta">                ${fuCategoryBadge(item.classification.category)}                <span>≡ƒôñ ${esc(item.from)}</span>                <span>≡ƒôà ${fuFormatDate(item.date)}</span>                <span>ΓÅ│ ${item.ageDays}d unanswered</span>              </div>            </div>          </div>          <div class="fu-card-body">            <div style="margin-bottom:6px">≡ƒôï <em>${esc(item.snippet)}</em></div>            <div style="font-size:.72rem">To: ${esc(item.to)} ${item.cc ? '| Cc: '+esc(item.cc) : ''}</div>            <div style="font-size:.72rem;color:var(--accent2)">Classification: ${esc(item.classification.reason)} ΓÇö Score: ${item.classification.score}</div>          </div>          <div class="fu-card-actions">            <select class="search-input" id="fuApprover_${item.id}" style="max-width:260px;padding:6px 10px;font-size:.78rem">              ${FU_EC_ADMINS.map(a => `<option value="${a.email}">${a.name} (${a.role})</option>`).join('')}            </select>            <button class="btn success fu-approve-btn" data-fu-id="${item.id}">Γ£à Approve</button>            <button class="btn danger-outline fu-reject-btn" data-fu-id="${item.id}">Γ¥î Reject</button>          </div>        </div>      `).join('')}    </div>    <!-- Approved -->    <div class="fu-section" id="fuSecApproved">      ${a.length === 0 ? `        <div class="fu-empty"><div class="fu-empty-icon">≡ƒôï</div><p>No approved follow-ups pending execution.</p></div>      ` : a.map(item => `        <div class="fu-card">          <div class="fu-card-header">            ${fuScoreBadge(item.classification.score)}            <div style="flex:1;min-width:0">              <div style="font-weight:600;font-size:.88rem" class="truncate">${esc(item.subject)}</div>              <div class="fu-meta">                ${fuCategoryBadge(item.classification.category)}                <span>Γ£à Approved by ${fuAdminName(item.approvedBy)}</span>                <span>≡ƒôà ${fuFormatDate(item.approvedAt)}</span>              </div>            </div>          </div>          <div class="fu-card-body">            <div>≡ƒôï <em>${esc(item.snippet)}</em></div>          </div>          <div class="fu-card-actions">            <button class="btn danger-outline fu-stop-btn" data-fu-id="${item.id}">≡ƒ¢æ Stop</button>          </div>        </div>      `).join('')}    </div>    <!-- Sent -->    <div class="fu-section" id="fuSecSent">      ${s.length === 0 ? `        <div class="fu-empty"><div class="fu-empty-icon">≡ƒô¼</div><p>No follow-ups sent yet.</p></div>      ` : s.map(item => `        <div class="fu-card">          <div class="fu-card-header">            ${fuScoreBadge(item.classification.score)}            <div style="flex:1;min-width:0">              <div style="font-weight:600;font-size:.88rem" class="truncate">${esc(item.subject)}</div>              <div class="fu-meta">                ${fuCategoryBadge(item.classification.category)}                <span>≡ƒôñ Follow-ups sent: ${item.followUpCount}</span>                <span>≡ƒôà Last: ${fuFormatDate(item.lastFollowUpAt)}</span>                <span>Γ£à By: ${fuAdminName(item.approvedBy)}</span>              </div>            </div>          </div>          <div class="fu-card-body">            <div>≡ƒôï <em>${esc(item.snippet)}</em></div>          </div>          <div class="fu-card-actions">            <button class="btn danger-outline fu-stop-btn" data-fu-id="${item.id}">≡ƒ¢æ Stop Workflow</button>          </div>        </div>      `).join('')}    </div>    <!-- Stopped -->    <div class="fu-section" id="fuSecStopped">      ${st.length === 0 ? `        <div class="fu-empty"><div class="fu-empty-icon">≡ƒ¢æ</div><p>No stopped follow-ups.</p></div>      ` : st.map(item => `        <div class="fu-card" style="opacity:.7">          <div class="fu-card-header">            ${fuScoreBadge(item.classification.score)}            <div style="flex:1;min-width:0">              <div style="font-weight:600;font-size:.88rem" class="truncate">${esc(item.subject)}</div>              <div class="fu-meta">                ${fuCategoryBadge(item.classification.category)}                <span>≡ƒ¢æ Stopped by: ${fuAdminName(item.stoppedBy)}</span>                <span>≡ƒôà ${fuFormatDate(item.stoppedAt)}</span>              </div>            </div>          </div>        </div>      `).join('')}    </div>    <div class="panel" style="margin-top:20px">      <div class="panel-header"><h3>Γä╣∩╕Å How It Works</h3></div>      <div class="panel-body" style="font-size:.82rem;color:var(--muted);line-height:1.8">        <ol style="padding-left:20px">          <li><strong>Scan</strong> ΓÇö The agent searches Gmail for unanswered emails from external parties (government, vendors, venues, etc.) older than 3 days.</li>          <li><strong>Classify</strong> ΓÇö Each email is scored by criticality (government, venue, legal, financial, urgent, etc.) on a 0-100 scale.</li>          <li><strong>Review</strong> ΓÇö Flagged emails appear here for EC admin review with an approve/reject decision.</li>          <li><strong>Execute</strong> ΓÇö Approved items get a professional threaded follow-up email. The approver is CC'd so they can monitor and respond.</li>          <li><strong>Stop</strong> ΓÇö Any EC admin can stop an active follow-up workflow at any time from this dashboard.</li>        </ol>        <p style="margin-top:10px"><strong>CLI:</strong> <code>node banf-email-followup-agent.js scan|execute|status|approve|reject|stop</code></p>      </div>    </div>  `;}function bindFollowUpEvents() {  // Tab switching  document.querySelectorAll('.fu-tab').forEach(tab => {    tab.addEventListener('click', () => {      document.querySelectorAll('.fu-tab').forEach(t => t.classList.remove('active'));      document.querySelectorAll('.fu-section').forEach(s => s.classList.remove('active'));      tab.classList.add('active');      const tabName = tab.dataset.fuTab;      const sectionMap = { pending:'fuSecPending', approved:'fuSecApproved', sent:'fuSecSent', stopped:'fuSecStopped' };      document.getElementById(sectionMap[tabName])?.classList.add('active');    });  });  // Approve buttons  document.querySelectorAll('.fu-approve-btn').forEach(btn => {    btn.addEventListener('click', () => {      const id = btn.dataset.fuId;      const select = document.getElementById('fuApprover_'+id);      const approverEmail = select ? select.value : FU_EC_ADMINS[0].email;      const idx = FOLLOWUP_DATA.queue.findIndex(q => q.id === id);      if (idx === -1) { toast('Item not found','error'); return; }      const item = FOLLOWUP_DATA.queue.splice(idx, 1)[0];      item.status = 'approved';      item.approvedBy = approverEmail;      item.approvedAt = new Date().toISOString();      FOLLOWUP_DATA.approved.push(item);      FOLLOWUP_DATA.stats.totalApproved = (FOLLOWUP_DATA.stats.totalApproved||0) + 1;      saveFollowUpData();      audit('Email follow-up approved', 'create', `Approved: "${item.subject}" by ${fuAdminName(approverEmail)}`, STATE.adminName, item.id);      saveState();      toast(`Γ£à Follow-up approved for: ${item.subject.slice(0,50)}...`);      render('followup');    });  });  // Reject buttons  document.querySelectorAll('.fu-reject-btn').forEach(btn => {    btn.addEventListener('click', () => {      const id = btn.dataset.fuId;      const idx = FOLLOWUP_DATA.queue.findIndex(q => q.id === id);      if (idx === -1) { toast('Item not found','error'); return; }      const item = FOLLOWUP_DATA.queue.splice(idx, 1)[0];      item.status = 'rejected';      item.rejectedAt = new Date().toISOString();      saveFollowUpData();      audit('Email follow-up rejected', 'delete', `Rejected: "${item.subject}"`, STATE.adminName, item.id);      saveState();      toast(`Γ¥î Follow-up rejected: ${item.subject.slice(0,50)}...`);      render('followup');    });  });  // Stop buttons (in approved + sent sections)  document.querySelectorAll('.fu-stop-btn').forEach(btn => {    btn.addEventListener('click', () => {      const id = btn.dataset.fuId;      if (!confirm('Stop this follow-up workflow? The agent will no longer send follow-ups for this email.')) return;      // Check approved first, then sent      let idx = FOLLOWUP_DATA.approved.findIndex(a => a.id === id);      let source = 'approved';      if (idx === -1) { idx = FOLLOWUP_DATA.sent.findIndex(s => s.id === id); source = 'sent'; }      if (idx === -1) { toast('Item not found','error'); return; }      const item = (source === 'approved' ? FOLLOWUP_DATA.approved : FOLLOWUP_DATA.sent).splice(idx, 1)[0];      item.status = 'stopped';      item.stoppedBy = STATE.adminName;      item.stoppedAt = new Date().toISOString();      FOLLOWUP_DATA.stopped.push(item);      FOLLOWUP_DATA.stats.totalStopped = (FOLLOWUP_DATA.stats.totalStopped||0) + 1;      saveFollowUpData();      audit('Email follow-up stopped', 'delete', `Stopped: "${item.subject}" by ${STATE.adminName}`, STATE.adminName, item.id);      saveState();      toast(`≡ƒ¢æ Follow-up stopped: ${item.subject.slice(0,50)}...`);      render('followup');    });  });  // Scan button ΓÇö triggers agent via instructions (in real deployment, calls backend)  document.getElementById('fuScanBtn')?.addEventListener('click', () => {    openModal('≡ƒöì Scan for Critical Emails', `      <div style="font-size:.82rem;color:var(--muted);line-height:1.7">        <p>The Email Follow-Up Agent will scan your Gmail inbox for:</p>        <ul style="padding-left:20px;margin:10px 0">          <li>Unanswered emails older than 3 days</li>          <li>Government / venue / legal / financial correspondence</li>          <li>Starred or important emails without response</li>        </ul>        <p style="margin-top:12px"><strong>Run from terminal:</strong></p>        <code style="display:block;background:var(--bg);padding:10px;border-radius:6px;margin-top:6px;font-size:.78rem">node banf-email-followup-agent.js scan</code>        <p style="margin-top:10px">Or for a preview without writing to the store:</p>        <code style="display:block;background:var(--bg);padding:10px;border-radius:6px;margin-top:6px;font-size:.78rem">node banf-email-followup-agent.js scan --dry-run</code>        <p style="margin-top:12px;font-size:.72rem;color:var(--accent2)">After scanning, import the results using the <strong>≡ƒôÑ Import</strong> button to load detected emails into this dashboard.</p>      </div>    `, '<button class="btn" onclick="closeModal()">Close</button>');  });  // Execute button  document.getElementById('fuExecBtn')?.addEventListener('click', () => {    const approved = FOLLOWUP_DATA.approved.length;    if (approved === 0) { toast('No approved follow-ups to execute','error'); return; }    openModal('≡ƒôñ Execute Follow-Ups', `      <div style="font-size:.82rem;color:var(--muted);line-height:1.7">        <p>There are <strong>${approved}</strong> approved follow-up(s) ready to send.</p>        <p style="margin-top:12px"><strong>Run from terminal:</strong></p>        <code style="display:block;background:var(--bg);padding:10px;border-radius:6px;margin-top:6px;font-size:.78rem">node banf-email-followup-agent.js execute</code>        <p style="margin-top:10px;font-size:.72rem">Each approved email will receive a professional threaded follow-up. The approver will be CC'd on every follow-up so they can monitor and intervene.</p>      </div>    `, '<button class="btn" onclick="closeModal()">Close</button>');  });  // Import button ΓÇö load banf-email-followup-status.json  document.getElementById('fuImportBtn')?.addEventListener('click', () => {    const fileInput = document.createElement('input');    fileInput.type = 'file';    fileInput.accept = '.json';    fileInput.onchange = e => {      const file = e.target.files[0];      if (!file) return;      const reader = new FileReader();      reader.onload = evt => {        try {          const data = JSON.parse(evt.target.result);          if (!data.queue && !data.approved && !data.sent) throw new Error('Invalid follow-up data format');          // Merge: add new queue items, don't duplicate by gmailMessageId          const existingIds = new Set([            ...FOLLOWUP_DATA.queue.map(q => q.gmailMessageId),            ...FOLLOWUP_DATA.approved.map(a => a.gmailMessageId),            ...FOLLOWUP_DATA.sent.map(s => s.gmailMessageId),            ...FOLLOWUP_DATA.stopped.map(s => s.gmailMessageId),          ]);          let added = 0;          (data.queue || []).forEach(item => {            if (!existingIds.has(item.gmailMessageId)) {              FOLLOWUP_DATA.queue.push(item);              existingIds.add(item.gmailMessageId);              added++;            }          });          // Also sync approved/sent/stopped          (data.approved || []).forEach(item => { if (!existingIds.has(item.gmailMessageId)) { FOLLOWUP_DATA.approved.push(item); existingIds.add(item.gmailMessageId); } });          (data.sent || []).forEach(item => { if (!existingIds.has(item.gmailMessageId)) { FOLLOWUP_DATA.sent.push(item); existingIds.add(item.gmailMessageId); } });          (data.stopped || []).forEach(item => { if (!existingIds.has(item.gmailMessageId)) { FOLLOWUP_DATA.stopped.push(item); existingIds.add(item.gmailMessageId); } });          FOLLOWUP_DATA.stats = data.stats || FOLLOWUP_DATA.stats;          FOLLOWUP_DATA.lastScanAt = data.lastScanAt || FOLLOWUP_DATA.lastScanAt;          saveFollowUpData();          toast(`≡ƒôÑ Imported ${added} new follow-up candidate(s)`);          render('followup');        } catch(err) { toast('Invalid file: '+err.message, 'error'); }      };      reader.readAsText(file);    };    fileInput.click();  });}// Load on initloadFollowUpData();// ΓöÇΓöÇ Admin Name ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇdocument.getElementById('adminNameBtn').addEventListener('click', () => {  openModal('Set Admin Name', `    <p style="font-size:.82rem;color:var(--muted);margin-bottom:12px">All changes will be logged under this admin name in the audit trail.</p>    <div class="form-group"><label>Admin Name</label><input id="adminInput" value="${esc(STATE.adminName)}"></div>  `, '<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="adminSave">Save</button>');  document.getElementById('adminInput').focus();  document.getElementById('adminSave').onclick = () => {    const name = document.getElementById('adminInput').value.trim();    if (!name) { toast('Name cannot be empty','error'); return; }    const old = STATE.adminName;    STATE.adminName = name;    document.getElementById('adminNameBtn').textContent = name;    if (old !== name) {      audit('Admin changed from "'+old+'" to "'+name+'"', 'edit', 'Admin identity updated', 'system', '');      saveState(); toast('Admin name updated');    }    closeModal();  };});// ΓöÇΓöÇ Global search ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇdocument.getElementById('globalSearch').addEventListener('keydown', e => {  if (e.key === 'Enter') {    render('search');    setTimeout(() => {      const si = document.getElementById('uniSearch');      if (si) { si.value = e.target.value; si.dispatchEvent(new Event('input')); }    }, 50);  }});// ΓöÇΓöÇ Navigation ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇdocument.querySelectorAll('.nav-item').forEach(n => n.addEventListener('click', () => render(n.dataset.view)));// ΓöÇΓöÇ Keyboard shortcuts ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇdocument.addEventListener('keydown', e => {  if (e.key === 'Escape') closeModal();  if (e.ctrlKey && e.key === 'k') { e.preventDefault(); document.getElementById('globalSearch').focus(); }});// ΓöÇΓöÇ Init ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇinitState();document.getElementById('adminNameBtn').textContent = STATE.adminName;render('dashboard');// Audit filter (for audit view)document.addEventListener('input', e => {  if (e.target.id === 'auditFilter') {    const q = e.target.value.toLowerCase();    document.querySelectorAll('.audit-entry').forEach(el => {      el.style.display = el.textContent.toLowerCase().includes(q) ? '' : 'none';    });  }});console.log('≡ƒÅá BANF CRM Admin loaded ΓÇö', STATE.stats.totalMembers, 'members,', STATE.stats.totalFamilies, 'families');</script></body></html>
