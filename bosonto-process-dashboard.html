dius:8px;cursor:pointer;font-size:.82rem;display:flex;align-items:center;gap:8px;transition:.15s}.sidebar nav button:hover{background:rgba(99,102,241,.08)}.sidebar nav button.active{background:rgba(99,102,241,.15);color:var(--accent2);font-weight:600}.sidebar nav button .count{margin-left:auto;font-size:.68rem;background:var(--card);padding:2px 6px;border-radius:8px;color:var(--muted)}.topbar{position:fixed;top:0;left:var(--sidebar-w);right:0;height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;z-index:90}.topbar .title{font-size:.88rem;font-weight:600;display:flex;align-items:center;gap:8px}.topbar .actions{display:flex;gap:8px;align-items:center}.main{margin-left:var(--sidebar-w);margin-top:var(--topbar-h);padding:24px;min-height:calc(100vh - var(--topbar-h))}#content{max-width:1400px;margin:0 auto}/* ΓöÇΓöÇ Cards & Stats ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:24px}.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;position:relative;overflow:hidden}.stat-card .icon{font-size:1.5rem;margin-bottom:6px}.stat-card .value{font-size:1.6rem;font-weight:700;line-height:1.2}.stat-card .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.stat-card .bar{position:absolute;bottom:0;left:0;height:3px;border-radius:0 3px 0 0}/* ΓöÇΓöÇ Pipeline Flow ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.pipeline-flow{display:flex;gap:4px;align-items:center;margin:16px 0;flex-wrap:wrap}.pipeline-stage{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:100px;padding:10px 8px;border-radius:10px;border:1px solid var(--border);background:var(--card);flex:1;text-align:center;transition:.2s}.pipeline-stage.active{border-color:var(--accent);background:rgba(99,102,241,.08)}.pipeline-stage.completed{border-color:var(--success);background:rgba(34,197,94,.06)}.pipeline-stage .stage-icon{font-size:1.3rem}.pipeline-stage .stage-name{font-size:.68rem;font-weight:600;color:var(--muted)}.pipeline-stage .stage-count{font-size:1.1rem;font-weight:700}.pipeline-arrow{font-size:1.2rem;color:var(--muted);flex-shrink:0}/* ΓöÇΓöÇ Table ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--card)}table{width:100%;border-collapse:collapse}thead{background:var(--surface)}th{padding:10px 14px;text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);border-bottom:1px solid var(--border);white-space:nowrap}td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:.82rem;vertical-align:middle}tr:hover{background:rgba(99,102,241,.04)}/* ΓöÇΓöÇ Tags & Badges ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:.68rem;font-weight:600;margin:1px}.tag.yes{background:rgba(34,197,94,.15);color:#4ade80}.tag.no{background:rgba(239,68,68,.15);color:#f87171}.tag.pending{background:rgba(245,158,11,.15);color:#fbbf24}.tag.completed{background:rgba(34,197,94,.15);color:#4ade80}.tag.active{background:rgba(34,197,94,.15);color:#4ade80}.tag.skipped{background:rgba(139,143,163,.1);color:#8b8fa3}.tag.not_started{background:rgba(139,143,163,.1);color:#8b8fa3}.tag.in_progress{background:rgba(99,102,241,.15);color:#818cf8}.tag.ec{background:rgba(236,72,153,.15);color:#f472b6;margin-left:4px}.tag.premium{background:rgba(139,92,246,.15);color:#a78bfa}.tag.recommended{background:linear-gradient(135deg,rgba(139,0,0,.2),rgba(192,0,32,.2));color:#fca5a5;border:1px solid rgba(192,0,32,.3)}/* ΓöÇΓöÇ Buttons ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.btn{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.78rem;font-weight:500;transition:.15s;display:inline-flex;align-items:center;gap:6px}.btn:hover{border-color:var(--accent);background:rgba(99,102,241,.08)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:#5558e6}.btn.success{background:var(--success);color:#fff;border-color:var(--success)}.btn.danger{background:transparent;color:var(--danger);border-color:var(--danger)}.btn.sm{padding:4px 8px;font-size:.72rem}.btn.lg{padding:10px 20px;font-size:.88rem}/* ΓöÇΓöÇ Modal ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ */.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:90%;max-width:720px;max-height:85vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}.modal-header h3{font-size:.92rem;font-weight:700}.modal-body{padding:20px;overflow-y:auto;flex:1}.modal-footer{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}/* ΓöÇ bject || '') + '</div>';    h += '</div>';    // Body    h += '<div style="margin-bottom:10px">';    h += '<div style="font-size:.68rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Body</div>';    h += '<div style="font-size:.78rem;padding:12px;background:var(--surface);border-radius:6px;border:1px solid var(--border);white-space:pre-wrap;line-height:1.6;color:var(--text)">' + esc(tmpl.body || '') + '</div>';    h += '</div>';    // Variables    if (tmpl.variables && tmpl.variables.length) {      h += '<div style="font-size:.68rem;color:var(--muted);margin-top:8px">';      h += '<strong>Variables:</strong> ' + tmpl.variables.map(function(v) { return '<code style="background:var(--surface);padding:1px 4px;border-radius:3px;font-size:.64rem">{{' + esc(v) + '}}</code>'; }).join(' ');      h += '</div>';    }    h += '</div></div>';  });  return h;}// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ// ATTENDANCE REPORT VIEW// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉfunction renderAttendance() {  var likely = STATE.pipeline.filter(isLikely);  var h = '<h2 style="margin-bottom:16px">≡ƒô¥ Attendance Report ΓÇö Bosonto Utsob 2026</h2>';  // Summary box  var totalA = 0, totalK = 0;  likely.forEach(function(r) { totalA += r.adults; totalK += r.kids; });  h += '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:20px">';  h += '<div style="display:flex;gap:20px;flex-wrap:wrap;font-size:.88rem">';  h += '<div><strong>Total Attendees:</strong> ' + (totalA + totalK) + '</div>';  h += '<div><strong>Adults:</strong> ' + totalA + '</div>';  h += '<div><strong>Kids:</strong> ' + totalK + '</div>';  h += '<div><strong>Families/Individuals:</strong> ' + likely.length + '</div>';  h += '</div></div>';  h += '<div class="table-wrap"><table><thead><tr>';  h += '<th>#</th><th>Name</th><th>RSVP</th><th>Email</th><th>Phone</th><th>Adults</th><th>Kids</th><th>Total</th><th>Dietary</th><th>Membership</th><th>Paid</th><th>Drive</th>';  h += '</tr></thead><tbody>';  likely.forEach(function(rec, idx) {    var cat = getCategoryById(rec.selectedCategory);    h += '<tr>';    h += '<td>' + (idx + 1) + '</td>';    h += '<td><strong>' + esc(rec.displayName) + '</strong>';    if (rec.householdMembers && rec.householdMembers.length) h += '<br><span style="font-size:.68rem;color:var(--muted)">' + rec.householdMembers.map(function(hm) { return esc(hm.name); }).join(', ') + '</span>';    h += '</td>';    h += '<td>' + rsvpTag(rec.rsvp) + '</td>';    h += '<td style="font-size:.72rem">' + esc(rec.email) + '</td>';    h += '<td style="font-size:.72rem">' + esc(rec.phone || 'ΓÇö') + '</td>';    h += '<td>' + rec.adults + '</td>';    h += '<td>' + rec.kids + '</td>';    h += '<td style="font-weight:700">' + (rec.adults + rec.kids) + '</td>';    h += '<td>' + esc(rec.dietary) + '</td>';    h += '<td style="font-size:.72rem">' + (cat ? esc(cat.name) : 'ΓÇö') + '</td>';    h += '<td>' + (rec.paymentStatus === 'paid' ? 'Γ£à' : 'Γ¥î') + '</td>';    h += '<td>' + (rec.driveSignupComplete ? 'Γ£à' : 'Γ¥î') + '</td>';    h += '</tr>';  });  h += '</tbody></table></div>';  return h;}// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ// AUDIT TRAIL VIEW// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉfunction renderAudit() {  var h = '<h2 style="margin-bottom:16px">≡ƒô£ Audit Trail</h2>';  var audits = STATE.audit || [];  if (audits.length === 0) {    h += '<div class="empty-state"><div class="icon">≡ƒô£</div><p>No audit entries yet. Actions will be logged here.</p></div>';    return h;  }  h += '<div style="margin-bottom:12px"><input class="search-input" id="auditFilter" placeholder="≡ƒöì Filter audit entries..."></div>';  h += '<div class="table-wrap"><table><thead><tr>';  h += '<th>Time</th><th>Action</th><th>Detail</th><th>Category</th><th>Member</th>';  h += '</tr></thead><tbody>';  audits.forEach(function(a) {    h += '<tr class="audit-entry">';    h += '<td style="font-size:.72rem;white-space:nowrap">' + new Date(a.timestamp).toLocaleString() + '</td>';    h += '<td style="font-weight:600;font-size:.82rem">' + esc(a.action) + '</td>';    h += '<td style="font-size:.78rem;color:var(--muted)">' + esc(a.detail) + '</td>';    h += '<td><span class="tag">' + esc(a.category) + '</span></td>';    h += '<td style="font-size:.72rem">' + esc(a.email) + '</td>';    h += '</tr>';  });  h += '</tbody></table></div>';  // Bind filter  setTimeout(function() {    var filterEl = document.getElementById('auditFilter');    if (filterEl) filterEl.addEventListener('input', function(e) {      var q = e.target.value.toLowerCase();      document.querySelectorAll('.audit-entry').forEach(function(row) {        row.style.display = row.textContent.toLowerCase().includes(q) ? '' : 'none';      });    });  }, 100);  return h;}// ΓöÇΓöÇ Init ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇdocument.getElementById('genTime').textContent = new Date(STATE.generatedAt).toLocaleString();updateNavCounts();render('dashboard');</script></body></html>
