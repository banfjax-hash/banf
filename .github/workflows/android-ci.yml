name: Android CI/CDon:  push:    branches: [ main ]    paths:      - 'android/**'  pull_request:    branches: [ main ]    paths:      - 'android/**'jobs:  test:    name: Run Tests    runs-on: ubuntu-latest    defaults:      run:        working-directory: android/BANF    steps:      - uses: actions/checkout@v4      - name: Set up JDK 17        uses: actions/setup-java@v4        with:          java-version: '17'          distribution: 'temurin'          cache: gradle      - name: Grant execute permission for gradlew        run: chmod +x gradlew      - name: Decode google-services.json        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json      - name: Run unit tests        run: ./gradlew test      - name: Run lint        run: ./gradlew lint  build:    name: Build Release AAB    needs: test    runs-on: ubuntu-latest    if: github.ref == 'refs/heads/main' && github.event_name == 'push'    defaults:      run:        working-directory: android/BANF    steps:      - uses: actions/checkout@v4      - name: Set up JDK 17        uses: actions/setup-java@v4        with:          java-version: '17'          distribution: 'temurin'          cache: gradle      - name: Grant execute permission for gradlew        run: chmod +x gradlew      - name: Decode google-services.json        run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json      - name: Decode keystore        run: |          echo "${{ secrets.ANDROID_KEYSTORE }}" | base64 -d > keystore/release.keystore      - name: Build Release AAB        run: ./gradlew bundleRelease        env:          KEYSTORE_PATH: keystore/release.keystore          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}      - name: Upload AAB artifact        uses: actions/upload-artifact@v4        with:          name: release-aab          path: android/BANF/app/build/outputs/bundle/release/app-release.aab  deploy:    name: Deploy to Play Store    needs: build    runs-on: ubuntu-latest    if: github.ref == 'refs/heads/main' && github.event_name == 'push'    defaults:      run:        working-directory: android/BANF    steps:      - uses: actions/checkout@v4      - name: Download AAB        uses: actions/download-artifact@v4        with:          name: release-aab          path: android/BANF/app/build/outputs/bundle/release/      - name: Set up Ruby        uses: ruby/setup-ruby@v1        with:          ruby-version: '3.2'          bundler-cache: true          working-directory: android/BANF      - name: Install Fastlane        run: gem install fastlane      - name: Decode Play Store service account key        run: echo "${{ secrets.PLAY_STORE_JSON_KEY }}" | base64 -d > fastlane/play-store-key.json      - name: Deploy to Internal Testing        run: fastlane deploy_internal        env:          PLAY_STORE_JSON_KEY: fastlane/play-store-key.json