m Verification (${paidEmails.length} paid)</button>        <button class="btn btn-outline" onclick="createBatch('${unpaidYesEmails.join(',')}','payment_reminder')">≡ƒÆ░ Payment Reminders (${unpaidYesEmails.length} Evite-Yes)</button>      </div>    </div>    ${BATCHES.length ? `    <div class="card">      <div class="card-header"><h3>≡ƒôï Batch Queue</h3></div>      <div class="table-wrap">        <table>          <thead><tr><th>Batch ID</th><th>Type</th><th>Count</th><th>Progress</th><th>Status</th><th>Actions</th></tr></thead>          <tbody>            ${BATCHES.map(b => `<tr>              <td style="font-size:.7rem;font-family:monospace">${b.batchId}</td>              <td>${b.processingType}</td>              <td>${b.totalCount}</td>              <td>${b.processedCount}/${b.totalCount}</td>              <td><span class="tag ${b.status==='completed'?'complete':b.status==='processing'?'pending':'unpaid'}">${b.status.toUpperCase()}</span></td>              <td>${b.status==='queued'?`<button class="btn btn-sm btn-success" onclick="approveBatchUI('${b.batchId}')">Γ£ô Approve</button>`:''}</td>            </tr>`).join('')}          </tbody>        </table>      </div>    </div>` : ''}  `;}// ΓöÇΓöÇ Emails ΓöÇΓöÇfunction renderEmails() {  return `    <div class="card">      <div class="card-header">        <h3>≡ƒôº Email Log ${STATE.testMode ? '(TEST MODE ΓÇö all to '+STATE.testEmail+')' : ''}</h3>        <span style="font-size:.7rem;color:var(--muted)">${EMAIL_LOG.length} emails</span>      </div>      ${EMAIL_LOG.length === 0 ? '<p style="color:var(--muted);font-size:.78rem;padding:20px;text-align:center">No emails sent yet. Use Quick Actions or Batch Processing to send test emails.</p>' : `      <div class="table-wrap">        <table>          <thead><tr><th>Time</th><th>To</th><th>Original To</th><th>Type</th><th>Subject</th><th>Test?</th><th>Status</th></tr></thead>          <tbody>            ${EMAIL_LOG.map(e => `<tr>              <td style="font-size:.66rem;color:var(--muted)">${new Date(e.time).toLocaleString()}</td>              <td style="font-weight:600">${e.to}</td>              <td style="color:var(--muted)">${e.originalTo}</td>              <td>${e.type}</td>              <td style="font-size:.7rem">${e.subject}</td>              <td>${e.testMode?'<span class="tag pending">TEST</span>':'<span class="tag complete">LIVE</span>'}</td>              <td><span class="tag ${e.status==='sent'?'paid':'unpaid'}">${e.status}</span></td>            </tr>`).join('')}          </tbody>        </table>      </div>`}    </div>  `;}// ΓöÇΓöÇ Settings ΓöÇΓöÇfunction renderSettings() {  return `    <div class="card">      <div class="card-header"><h3>ΓÜÖ∩╕Å System Settings</h3></div>            <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">        <div style="padding:16px;border:2px solid ${STATE.testMode?'var(--warn)':'var(--success)'};border-radius:10px">          <h4 style="font-size:.82rem;margin-bottom:8px">${STATE.testMode?'≡ƒº¬':'≡ƒƒó'} Email Mode</h4>          <p style="font-size:.72rem;color:var(--muted);margin-bottom:10px">            ${STATE.testMode               ? `<strong>TEST MODE:</strong> All emails are redirected to <strong>${STATE.testEmail}</strong>. Original recipient is shown in the subject line for verification.`              : '<strong>LIVE MODE:</strong> Emails go to actual recipients. Use with caution.'}          </p>          <button class="btn ${STATE.testMode?'btn-success':'btn-warn'}" onclick="toggleTestMode()">            ${STATE.testMode ? '≡ƒƒó Switch to LIVE Mode' : '≡ƒº¬ Switch to TEST Mode'}          </button>          ${STATE.testMode ? '' : '<p style="font-size:.64rem;color:var(--danger);margin-top:6px">ΓÜá∩╕Å Live mode sends real emails to members!</p>'}        </div>        <div style="padding:16px;border:2px solid ${STATE.batchMode?'var(--success)':'var(--border)'};border-radius:10px">          <h4 style="font-size:.82rem;margin-bottom:8px">≡ƒöä Batch Processing</h4>          <p style="font-size:.72rem;color:var(--muted);margin-bottom:10px">            ${STATE.batchMode               ? '<strong>ENABLED:</strong> Approved batches will process. Each batch still requires explicit approval.'              : '<strong>DISABLED:</strong> No batch processing runs. Individual test emails can still be sent.'}          </p>          <button class="btn ${STATE.batchMode?'btn-danger':'btn-success'}" onclick="toggleBatch()">            ${STATE.batchMode ? 'ΓÅ╕ Disable Batch' : 'Γû╢ Enable Batch'}          </button>        </div>      </div>      <div style="margin-top:16px;padding:14px;background:var(--surface);border-radius:10px;border:1px solid var(--border)">        <h4 style="font-size:.78rem;margin-bottom:8px;color:var(--accent2)">≡ƒô¥ Admin Notes</h4>        <ul style="font-size:.74rem;color:var(--muted);padding-left:18px">          <li>During testing, <strong>all emails</strong> route to <strong>${STATE.testEmail}</strong></li>          <li>The original intended recipient appears in the subject line: <code>[TEST ΓåÆ actual@email.com]</code></li>          <li>Admin manual edits to any CRM field are treated as the <strong>benchmark of truth</strong></li>          <li>Pipeline stages auto-re-evaluate when payment/membership data changes</li>          <li>Batch processing will not start until admin explicitly enables it AND approves each batch</li>          <li>After testing, switch to LIVE mode only with admin instruction</li>        </ul>      </div>    </div>    <div class="card">      <div class="card-header"><h3>≡ƒÆ▓ 2026-27 Membership Pricing</h3></div>      <div class="table-wrap">        <table>          <thead><tr><th>Category</th><th>Family</th><th>Couple</th><th>Individual</th><th>Student</th></tr></thead>          <tbody>            ${Object.entries(PRICING).map(([k,v]) => `<tr>              <td><strong>${v.name}</strong></td>              <td>$${v.family}</td><td>$${v.couple}</td><td>$${v.individual}</td><td>$${v.student}</td>            </tr>`).join('')}          </tbody>        </table>      </div>    </div>  `;}// ΓöÇΓöÇ Audit ΓöÇΓöÇfunction renderAudit() {  return `    <div class="card">      <div class="card-header"><h3>≡ƒôï Audit Log ΓÇö All Admin Actions</h3><span style="font-size:.7rem;color:var(--muted)">${AUDIT_LOG.length} entries</span></div>      ${AUDIT_LOG.map(e => `        <div class="audit-entry">          <div class="time">${new Date(e.time).toLocaleString()}</div>          <span class="action">${e.action}</span>          ${e.member ? `<span style="color:var(--muted)"> ΓåÆ ${e.member}</span>` : ''}          <div style="font-size:.68rem;color:var(--muted);margin-top:2px">${e.details}</div>        </div>      `).join('')}    </div>  `;}// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ// ADMIN EDIT SYSTEM// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉfunction openEdit(email, field) {  const m = MEMBERS.find(x => x.email === email);  if (!m) return;  editingMember = { email, singleField: field };    const fieldDefs = getFieldDef(field, m);  document.getElementById('modalTitle').textContent = `Edit ${m.displayName} ΓÇö ${field}`;  document.getElementById('modalFields').innerHTML = fieldDefs;  document.getElementById('editModal').classList.add('show');}function openEditFull(email) {  const m = MEMBERS.find(x => x.email === email);  if (!m) return;  editingMember = { email, singleField: null };  const fields = ['displayName','phone','householdType','membershipCategory','membershipTier','paymentAmount','paymentStatus','paymentSenderName','eviteResponse','eviteAdults','eviteKids'];  document.getElementById('modalTitle').textContent = `Edit ${m.displayName}`;  document.getElementById('modalFields').innerHTML = fields.map(f => getFieldDef(f, m)).join('') + `    <div class="field">      <label>Reason for change</label>      <input type="text" id="edit_reason" placeholder="e.g., Admin verified via phone call" />    </div>  `;  document.getElementById('editModal').classList.add('show');}function getFieldDef(field, m) {  const val = m[field] ?? '';  switch(field) {    case 'householdType':      return `<div class="field"><label>${field}</label><select id="edit_${field}">        ${['individual','couple','family'].map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}      </select></div>`;    case 'membershipCategory':      return `<div class="field"><label>${field}</label><select id="edit_${field}">        <option value="">ΓÇö Select ΓÇö</option>        ${Object.entries(PRICING).map(([k,v]) => `<option value="${k}" ${val===k?'selected':''}>${v.name}</option>`).join('')}      </select></div>`;    case 'membershipTier':      return `<div class="field"><label>${field}</label><select id="edit_${field}">        ${['family','couple','individual','student'].map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}      </select></div>`;    case 'paymentStatus':      return `<div class="field"><label>${field}</label><select id="edit_${field}">        ${['unpaid','paid','partial','refunded'].map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}      </select></div>`;    case 'eviteResponse':      return `<div class="field"><label>${field}</label><select id="edit_${field}">        <option value="">None</option>        ${['yes','no','maybe'].map(o => `<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}      </select></div>`;    case 'paymentAmount': case 'eviteAdults': case 'eviteKids':      return `<div class="field"><label>${field}</label><input type="number" id="edit_${field}" value="${val}" /></div>`;    default:      return `<div class="field"><label>${field}</label><input type="text" id="edit_${field}" value="${val}" /></div>`;  }}function closeModal() {  document.getElementById('editModal').classList.remove('show');  editingMember = null;}async function saveEdits() {  if (!editingMember) return;  const { email, singleField } = editingMember;  const changes = {};  if (singleField) {    const el = document.getElementById(`edit_${singleField}`);    if (el) {      let val = el.value;      if (['paymentAmount','eviteAdults','eviteKids'].includes(singleField)) val = Number(val);      changes[singleField] = val;    }  } else {    const fields = ['displayName','phone','householdType','membershipCategory','membershipTier','paymentAmount','paymentStatus','paymentSenderName','eviteResponse','eviteAdults','eviteKids'];    fields.forEach(f => {      const el = document.getElementById(`edit_${f}`);      if (el) {        let val = el.value;        if (['paymentAmount','eviteAdults','eviteKids'].includes(f)) val = Number(val);        changes[f] = val;      }    });  }  const reason = document.getElementById('edit_reason')?.value || '';  try {    await API.updateMember(email, changes, reason);    closeModal();    toast('CRM updated ΓÇö admin change is benchmark of truth', 'success');    render();  } catch (e) {    toast('Error: ' + e.message, 'error');  }}// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ// ACTIONS// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉasync function toggleTestMode() {  STATE.testMode = !STATE.testMode;  await API.updateSettings({ testMode: STATE.testMode });  toast(STATE.testMode ? 'TEST MODE enabled ΓÇö emails ΓåÆ ' + STATE.testEmail : '≡ƒƒó LIVE MODE enabled', STATE.testMode ? 'info' : 'success');  render();}async function toggleBatch() {  STATE.batchMode = !STATE.batchMode;  await API.updateSettings({ batchMode: STATE.batchMode });  toast(STATE.batchMode ? 'Batch processing ENABLED' : 'Batch processing DISABLED', STATE.batchMode ? 'success' : 'info');  render();}async function sendOneEmail(email, type) {  try {    const result = await API.sendTestEmail(email, type);    toast(`Email sent ΓåÆ ${result.to}${result.testMode?' (TEST)':''}`, 'success');  } catch (e) {    toast('Email error: ' + e.message, 'error');  }}async function sendTestEmailToAll(type) {  const paid = MEMBERS.filter(m => m.paymentStatus === 'paid');  for (const m of paid) {    await API.sendTestEmail(m.email, type);  }  toast(`${paid.length} test emails sent ΓåÆ ${STATE.testEmail}`, 'success');  if (currentPage === 'emails') render();}async function createBatch(emailsStr, type) {  const emails = emailsStr.split(',').filter(Boolean);  if (!emails.length) { toast('No members to batch', 'error'); return; }  try {    const batch = await API.queueBatch(emails, type);    toast(`Batch ${batch.batchId} queued (${emails.length} members)`, 'info');    render();  } catch (e) {    toast('Error: ' + e.message, 'error');  }}async function approveBatchUI(batchId) {  if (!STATE.batchMode) {    toast('Enable batch processing first!', 'error');    return;  }  if (!confirm(`Approve and run batch ${batchId}? ${STATE.testMode?'(TEST MODE ΓÇö emails go to '+STATE.testEmail+')':'ΓÜá∩╕Å LIVE MODE ΓÇö emails go to real members!'}`)) return;  try {    const result = await API.approveBatch(batchId);    toast(`Batch ${batchId} completed: ${result.processedCount}/${result.totalCount}`, 'success');    render();  } catch (e) {    toast('Error: ' + e.message, 'error');  }}// ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓò
