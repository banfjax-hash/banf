# ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ#  BANF Agent Drive Configuration# ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ##  This YAML file defines ALL pipeline drives that the email reader agent can#  activate. Each drive has a type, lifecycle rules, and configuration.##  Drive Types:#    ALWAYS_ON    ΓÇö Runs every poll cycle, never stops (payment, auto-response)#    EVENT_BOUND  ΓÇö Activated by first event email, deactivated after event date#    TRIGGERED    ΓÇö Activated manually by president/super-admin, deactivated by command##  Lifecycle States:#    dormant    ΓÇö Drive exists but is not active (default for EVENT_BOUND/TRIGGERED)#    active     ΓÇö Drive is running and processing emails#    completed  ΓÇö Drive finished its purpose (post-event, drive closed)#    suspended  ΓÇö Drive paused (e.g. awaiting approval, issue detected)##  The Event Manager Agent (banf-event-manager.js) reads this file and manages#  drive state in drive-state.json. The email reader consults drive state before#  routing emails to pipelines.##  To add a new drive: add an entry below, restart the email reader.#  To change drive state: use the Event Manager Agent CLI or admin portal.## ΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉΓòÉ# ΓöÇΓöÇΓöÇ Global Settings ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇglobal:  stateFile: drive-state.json  logFile: drive-manager.log  defaultPollInterval: 5          # minutes  adminEmail: ranadhir.ghosh@gmail.com  banfEmail: banfjax@gmail.com  fiscalYear: "2026-2027"  currentSeason: "2026-2027"# ΓöÇΓöÇΓöÇ ALWAYS-ON Drives ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ# These drives NEVER stop. They run every poll cycle regardless of events.drives:  # ΓöÇΓöÇ Auto Response (Testing/Full Confidence) ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  auto_response:    name: "Auto Response Pipeline"    description: >      Processes user query emails using the RL feedback engine. For high-confidence      classifications (spam ΓåÆ DO_NOTHING, member query ΓåÆ FULL_RESPONSE), acts autonomously.      For medium-confidence, routes to approval workflow. This drive is ALWAYS active      for testing and improving the classifier's confidence.    type: ALWAYS_ON    phase: "2c"                   # Phase in email reader runOnce()    handler: processUserQueries    dependencies:      - user-query-agent.js      - banf-rl-feedback-engine.js    gmailQuery: "to:banfjax@gmail.com -from:banfjax@gmail.com"    config:      autoRespondEnabled: true      confidenceThreshold: 0.85      minTrainingSamples: 20      approvalRequired: true      # Until training complete      rlPreFilter: true           # Use RL engine as pre-filter    activation:      trigger: always             # Never deactivates      startDate: null      endDate: null    metrics:      - totalProcessed      - autoResponded      - pendingApproval      - rejectedAsSpam  # ΓöÇΓöÇ Payment Processing ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  payment_processing:    name: "Payment Processing Pipeline"    description: >      Monitors Wells Fargo Zelle notifications for incoming payments. Classifies      payment purpose (membership, event ticket, donation, expense reimbursement),      updates CRM, and sends payment acknowledgment emails. Also tracks expenses      paid on behalf of BANF.    type: ALWAYS_ON    phase: "2"                    # Phase 2 in email reader    handler: scanNewPaymentEmails    dependencies:      - banf-payment-purpose-engine.js    gmailQuery: "from:alerts@notify.wellsfargo.com subject:account after:{since}"    config:      autoAcknowledge: true      acknowledgmentDelay: 0      # minutes (0 = immediate)      trackExpenses: true      deduplication: true    activation:      trigger: always      startDate: null      endDate: null    metrics:      - totalPayments      - totalAmount      - acknowledgmentsSent      - expensesTracked  # ΓöÇΓöÇ Delivery Failure Recovery ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  delivery_failure:    name: "Delivery Failure Recovery Pipeline"    description: >      Scans for bounce/delivery failure emails from mailer-daemon and postmaster.      Parses bounce codes, looks up CRM household for spouse recovery, and executes      recovery actions (spouse notification, president escalation). Uses send-once      pattern ΓÇö once action taken, address is suspended until manual reactivation.    type: ALWAYS_ON    phase: "2d"    handler: scanDeliveryFailures    dependencies:      - banf-delivery-failure-agent.js    gmailQuery: "from:mailer-daemon OR from:postmaster OR subject:Delivery Status"    config:      sendOnce: true              # Don't repeat recovery actions      reactivateCommand: "node banf-delivery-failure-agent.js --reactivate={email}"      spouseRecovery: true      presidentEscalation: true    activation:      trigger: always      startDate: null      endDate: null    metrics:      - totalBounces      - recovered      - escalated      - suspended  # ΓöÇΓöÇ Admin Instructions ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  admin_instructions:    name: "Admin Instruction Pipeline"    description: >      Processes instruction emails from the president (ADMIN_EMAIL) containing      specific commands in the subject line. Enables remote agent control via email.    type: ALWAYS_ON    phase: "2b"    handler: scanInstructionEmails    dependencies: []    gmailQuery: "from:{adminEmail} subject:instruction after:{since}"    config:      adminEmailOnly: true      commandPrefix: "instruction"    activation:      trigger: always      startDate: null      endDate: null# ΓöÇΓöÇΓöÇ EVENT-BOUND Drives ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ# These drives activate when an event is announced and deactivate after the event.  # ΓöÇΓöÇ Evite RSVP Pipeline ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  evite_rsvp:    name: "Evite RSVP Pipeline"    description: >      Monitors Evite notification emails for new RSVPs. Extracts guest name, RSVP      status, and cross-references with CRM for membership tier resolution. Triggers      auto-send of welcome/confirmation emails when --auto-send is enabled.    type: EVENT_BOUND    phase: "1"    handler: scanNewEviteEmails    dependencies: []    gmailQuery: "from:evite.com {eventName} after:{since}"    config:      autoSendEnabled: false      # Requires --auto-send CLI flag      batchSize: 3      tierResolution: true      spouseDetection: true    activation:      trigger: first_rsvp_email   # Becomes active when first Evite RSVP email arrives      startCondition: "First Evite notification email detected for the event"      endCondition: "Event date has passed"      startDate: null             # Set dynamically by Event Manager      endDate: null               # Set to event date by Event Manager    eventBinding:      eventNameField: eventName   # Which event this drive is bound to      eventDateField: eventDate   # When the event occurs    metrics:      - totalRsvps      - yesCount      - noCount      - maybeCount      - emailsSent  # ΓöÇΓöÇ Event Attendance ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  event_attendance:    name: "Event Attendance Pipeline"    description: >      Tracks attendance at events via QR code check-in. Cross-references RSVPs with      actual attendance. Updates EventAttendance Wix CMS collection.    type: EVENT_BOUND    phase: null                   # Runs via QR scanner, not email reader    handler: null    dependencies:      - banf-wix-linked/docs/admin-portal.html    config:      qrCodeEnabled: true      attendanceCollection: EventAttendance    activation:      trigger: event_day          # Active on event day only      startCondition: "Event day begins (midnight)"      endCondition: "Event day ends (midnight+1)"      startDate: null      endDate: null    eventBinding:      eventNameField: eventName      eventDateField: eventDate  # ΓöÇΓöÇ Post-Event Pipeline ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  post_event:    name: "Post-Event Pipeline"    description: >      After an event completes, sends thank-you emails to attendees and "we missed      you" emails to no-shows. Generates attendance Excel report. Triggers payment      acknowledgment agent for event payments.    type: EVENT_BOUND    phase: null                   # Manual trigger after event    handler: null    dependencies:      - bosonto-attendance-report.xlsx    config:      thankYouEnabled: true      missedYouEnabled: true      excelReportEnabled: true      paymentAckEnabled: true    activation:      trigger: event_completed    # Active day after event      startCondition: "Event date has passed"      endCondition: "All post-event tasks completed"      startDate: null      endDate: null    eventBinding:      eventNameField: eventName      eventDateField: eventDate# ΓöÇΓöÇΓöÇ TRIGGERED Drives ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ# These drives are activated by specific admin commands or events.  # ΓöÇΓöÇ Membership Drive ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  membership_drive:    name: "Membership Drive"    description: >      Bulk membership renewal campaign. Sends personalized renewal emails to all      members with expired or expiring memberships. Tracks renewal payments.      Triggered by president via admin instruction email or admin portal.    type: TRIGGERED    phase: null                   # Runs as standalone agent    handler: null    dependencies:      - banf-payment-purpose-engine.js    config:      renewalEmailTemplate: membership_renewal      reminderSchedule: [30, 14, 7, 1]  # days before deadline      earlyBirdDeadline: "2026-05-31"      trackPayments: true    activation:      trigger: president_command  # Activated by president email instruction      activationCommand: "activate membership_drive"      deactivationCommand: "deactivate membership_drive"      startDate: null      endDate: null    metrics:      - totalEmailsSent      - renewalsCompleted      - outstandingRenewals  # ΓöÇΓöÇ EC Onboarding ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  ec_onboarding:    name: "EC Onboarding Pipeline"    description: >      Onboarding workflow for new Executive Committee members. Sends welcome      packages, role descriptions, access credentials, and onboarding checklists.      Triggered by super admin after EC election.    type: TRIGGERED    phase: null    handler: null    dependencies: []    config:      welcomePackageEnabled: true      roleDescriptions: true      accessSetup: true      onboardingChecklistEnabled: true    activation:      trigger: super_admin_command      activationCommand: "activate ec_onboarding"      deactivationCommand: "deactivate ec_onboarding"      startDate: null      endDate: null  # ΓöÇΓöÇ QR Security Pipeline ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  qr_security:    name: "QR Security Pipeline"    description: >      QR code security verification for event entry. Validates member QR codes      against CRM, checks membership status and event RSVP. Reports unauthorized      access attempts to security coordinator.    type: TRIGGERED    phase: null    handler: null    dependencies:      - banf-wix-linked/docs/admin-portal.html    config:      securityLevel: standard      guestPassEnabled: true      alertOnUnauthorized: true    activation:      trigger: event_day      startDate: null      endDate: null  # ΓöÇΓöÇ Procurement Pipeline ΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇΓöÇ  procurement:    name: "Procurement Pipeline"    description: >      Tracks procurement requests and expense approvals for events. Members      submit expense receipts, treasurer verifies, and reimbursements are processed.    type: TRIGGERED    phase: null    handler: null    dependencies: [